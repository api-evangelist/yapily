solutions:
  - name: Account-to-Account Checkout
    description: Replace card rails with PISP-initiated A2A payments at checkout using single payments or Pay By Link.
  - name: Subscription Billing via VRP
    description: Replace card-on-file with Variable Recurring Payments for commercial subscriptions, with consent-bound caps.
  - name: Affordability and Underwriting
    description: Use AIS plus Data Plus enrichment to score affordability for lending, BNPL, and rentals.
  - name: Personal Finance Management
    description: Power PFM apps with consented bank data across 19 European markets through a single API.
  - name: Treasury and Reconciliation
    description: Pull balances and transactions across multiple business accounts for cash management and reconciliation.
  - name: Account Ownership Validation
    description: Verify customer-provided bank details at onboarding using Yapily Validate.
integrations:
  - name: UK Open Banking
    description: Connects to UK Open Banking Standard ASPSPs (CMA9 plus long tail) under FCA regulation.
  - name: Berlin Group NextGenPSD2
    description: Connects to EU ASPSPs implementing the Berlin Group NextGenPSD2 spec.
  - name: Yapily Connect (FCA)
    description: Yapily Connect Ltd acts as the regulated AISP/PISP of record in the UK.
  - name: Yapily Connect (Bank of Lithuania)
    description: Yapily Connect UAB acts as the regulated AISP/PISP of record across the EU.
  - name: MuleSoft
    description: yapily-mulesoft-connector enables drag-and-drop integration in MuleSoft.
  - name: Java / Python / Node.js SDKs
    description: Official SDKs published from the canonical OpenAPI spec.
  - name: Kubernetes (Helm)
    description: helm-charts repo for deploying Yapily-adjacent workloads.
useCases:
  - name: Pay-ins for Marketplaces
  - name: Bill Payments and Direct-to-Account Refunds
  - name: Salary Advance and Income Verification
  - name: Wealth and Investment Funding
  - name: Charity Donations
  - name: Bureaux de Change and FX Onboarding
  - name: Bulk Payouts (Payroll, Supplier Payments)
  - name: B2B Sweeping (Cash Concentration)
