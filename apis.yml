aid: yapily
url: https://raw.githubusercontent.com/api-evangelist/yapily/refs/heads/main/apis.yml
name: Yapily
description: >-
  Yapily is a UK-headquartered Open Banking platform that exposes a single REST API across 2,000+ banks in the UK and
  18+ European countries. The platform provides AISP (Account Information) and PISP (Payment Initiation) capabilities,
  Variable Recurring Payments (VRP), transaction enrichment (Data Plus), Account Validation, and Hosted Payment/Consent
  Pages. Yapily Connect Ltd is FCA-authorised in the UK and Yapily Connect UAB is authorised by the Bank of Lithuania
  for EU coverage, allowing customers to launch without holding their own PSD2 permissions.
