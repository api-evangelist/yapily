- aid: yapily:yapily-variable-recurring-payments-api
  name: Yapily Variable Recurring Payments API
  description: "Variable Recurring Payments enables transfer of money between accounts held by the same\
    \ person or transfer of money for business payments. \n\nIn order to make Sweeping Variable Recurring\
    \ Payments on behalf of a user, you are required to request an [Consent](#tag/Authorisations) from\
    \ the user by calling the Sweeping Consent endpoint to authorise the user's account to make the payment.\
    \ Once a `consent-token` is obtained, you can call the Payments endpoint to execute the Sweeping Variable\
    \ Recurring Payments transaction. Before executing the payment, you have the option to confirm availability\
    \ of funds in the user's account by calling the Funds Confirmation endpoint. \n\nSee [VRP Payments](/payments/vrps/additional-information)\
    \ for more information."
  humanURL: https://docs.yapily.com/api/reference/
  baseURL: https://api.yapily.com
