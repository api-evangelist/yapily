    PayeeAccountType:
      title: Payee Account Type
      type: string
      description: "__Optional__. The payee account type. \n\nAllowed values: BUSINESS, BUSINESS_SAVING, CHARITY, COLLECTION,\
        \ CORPORATE, E_WALLET, GOVERNMENT, INVESTMENT, INVESTMENT_ISA, JOINT_PERSONAL, PENSION, PERSONAL, PERSONAL_SAVING,\
        \ PREMIER, WEALTH ."
    Payer:
      title: Payer Details
      required:
      - accountIdentifications
      type: object
      properties:
        name:
          title: Payer Name
          type: string
          description: The account holder name of the Payer.
          example: John Doe
        accountIdentifications:
          uniqueItems: true
          type: array
          description: __Mandatory__. The account identifications that identify the `Payer` bank account.
          items:
            $ref: '#/components/schemas/AccountIdentification'
        address:
          $ref: '#/components/schemas/Address'
      description: __Conditional__. Details of the benefactor [person or business].
    PaymentChargeDetails:
      type: object
      description: Details the charges that will apply to the payment.
      properties:
        chargeAmount:
          $ref: '#/components/schemas/Amount'
        chargeType:
          description: __Mandatory__. Specifies the nature of the transaction charge e.g. (Bank transfer fees).
          type: string
        chargeTo:
          description: __Mandatory__. States which party of the payment bears the charges.
          type: string
    PaymentIsoStatus:
      type: object
      description: The payment status code, as denoted by a 3-letter ISO 20022 code.
      properties:
        code:
          $ref: '#/components/schemas/PaymentIsoStatusCodeEnum'
        name:
          type: string
          description: The full name of the ISO 20022 `PaymentStatusCode`.
          example: AcceptedCreditSettlementCompleted
    PaymentIsoStatusCodeEnum:
      type: string
      description: The ISO 20022 `PaymentStatusCode`.
      example: ACCC
      enum:
      - ACCC
      - ACCP
      - ACSC
      - ACSP
      - ACTC
      - ACWC
      - ACWP
      - RCVD
      - PDNG
      - RJCT
      - CANC
      - ACFC
      - PATC
      - PART
      - ACCO
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payment.
        institutionConsentId:
          type: string
          description: Identification of the consent at the Institution.
        paymentIdempotencyId:
          type: string
          description: __Mandatory__. A unique identifier that you must provide to identify the payment. This can be any alpha-numeric
            string but is limited to a maximum of 35 characters.
        paymentLifecycleId:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        statusDetails:
          $ref: '#/components/schemas/PaymentStatusDetails'
        payer:
          $ref: '#/components/schemas/Payer'
        payeeDetails:
          $ref: '#/components/schemas/Payee'
        reference:
          type: string
          description: __Optional__. The payment reference or description. Limited to a maximum of 18 characters long.
        amount:
          type: number
          description: Monetary amount.
        currency:
          type: string
          description: Currency the payment amount is denoted in. Specified as a 3-letter ISO 4217 code.
        amountDetails:
          $ref: '#/components/schemas/Amount'
        createdAt:
          type: string
          description: Date and time of when the payment request was created.
          format: date-time
        firstPaymentAmount:
          $ref: '#/components/schemas/Amount'
        firstPaymentDateTime:
          type: string
          description: Date and time of when the first payment request is to be made.
          format: date-time
        nextPaymentAmount:
          $ref: '#/components/schemas/Amount'
        nextPaymentDateTime:
          type: string
          description: __Conditional__. Defines when the recurring payment is to be made.
          format: date-time
        finalPaymentAmount:
          $ref: '#/components/schemas/Amount'
        finalPaymentDateTime:
          type: string
          description: Date and time of when the final payment is to be made.
          format: date-time
        numberOfPayments:
          type: integer
          description: Number of recurring payment requests to be made as part of the instructed payment schedule.
          format: int32
        previousPaymentAmount:
          $ref: '#/components/schemas/Amount'
        previousPaymentDateTime:
          type: string
          description: Date and time of when the previous payment request was posted.
          format: date-time
        chargeDetails:
          type: array
          items:
            $ref: '#/components/schemas/PaymentChargeDetails'
        scheduledPaymentType:
          type: string
          description: Details the execution type and the payment date between the payer and the payee.
        scheduledPaymentDateTime:
          type: string
          description: Date and time of when the scheduled payment request will be made.
          format: date-time
        frequency:
          $ref: '#/components/schemas/FrequencyResponse'
        currencyOfTransfer:
          type: string
          description: __Mandatory__. The currency to be transferred to the payee. This may differ from the currency the payment
            is denoted in and the currency of the payer's account. Specified as a 3-letter code (ISO 4217).
        purpose:
          type: string
          description: Specifies the external purpose code for the `Institution` - IS0 20022.
        priority:
          $ref: '#/components/schemas/PriorityCodeEnum'
        exchangeRate:
          $ref: '#/components/schemas/ExchangeRateInformationResponse'
        refundAccount:
          $ref: '#/components/schemas/RefundAccount'
        bulkAmountSum:
          type: number
    PaymentStatus:
      type: string
      description: "The status of the Payment. \n\nFor more information, see [Payment Status](/guides/payments/payment-status/)"
      enum:
      - PENDING
      - FAILED
      - DECLINED
      - COMPLETED
      - COMPLETED_SETTLEMENT_IN_PROCESS
      - EXPIRED
      - UNKNOWN
      - ACTIVE
      - INACTIVE
    PaymentStatusDetails:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        statusReason:
          type: string
        statusReasonDescription:
          type: string
        statusUpdateDate:
          type: string
          format: date-time
        multiAuthorisationStatus:
          $ref: '#/components/schemas/MultiAuthorisation'
        isoStatus:
          $ref: '#/components/schemas/PaymentIsoStatus'
    PriorityCodeEnum:
      type: string
      enum:
      - NORMAL
      - URGENT
    ProprietaryBankTransactionCode:
      type: object
      description: Transaction code that is proprietary to the `Institution`.
      properties:
        code:
          type: string
          description: __Mandatory__. Proprietary code used to identify the underlying transaction.
        issuer:
          type: string
          description: __Mandatory__. Issuer of the proprietary code.
    RateTypeEnum:
      type: string
      description: __Mandatory__. The type used to complete the currency exchange.
      enum:
      - ACTUAL
      - AGREED
      - INDICATIVE
    RawRequest:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        requestInstant:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: object
        bodyParameters:
          type: object
          additionalProperties:
            type: string
        startTime:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          deprecated: true
    RawResponse:
      deprecated: true
      type: object
      description: '[DEPRECATED] Interaction (raw request and response) that occurred with the `Institution` in order to fulfil
        a request.'
      properties:
        request:
          $ref: '#/components/schemas/RawRequest'
        duration:
          type: string
          format: iso8601
        headers:
          type: object
          additionalProperties:
            type: string
        resultCode:
          type: integer
          format: int32
        result:
          type: object
    RealTimeTransaction:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        bookingDateTime:
          type: string
          format: date-time
        valueDateTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TransactionStatusEnum'
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        grossAmount:
          $ref: '#/components/schemas/Amount'
        currencyExchange:
          $ref: '#/components/schemas/CurrencyExchange'
        chargeDetails:
          $ref: '#/components/schemas/TransactionChargeDetails'
        reference:
          type: string
        statementReferences:
          type: array
          items:
            $ref: '#/components/schemas/StatementReference'
        description:
          type: string
        transactionInformation:
          type: array
          items:
            type: string
        addressDetails:
          $ref: '#/components/schemas/AddressDetails'
        isoBankTransactionCode:
          $ref: '#/components/schemas/IsoBankTransactionCode'
        proprietaryBankTransactionCode:
          $ref: '#/components/schemas/ProprietaryBankTransactionCode'
        balance:
          $ref: '#/components/schemas/TransactionBalance'
        payeeDetails:
          $ref: '#/components/schemas/Payee'
        payerDetails:
          $ref: '#/components/schemas/Payer'
        merchant:
          $ref: '#/components/schemas/Merchant'
        supplementaryData:
          type: object
    RefundAccount:
      type: object
      description: The account to which funds should be returned if the payment is to be later refunded.
      properties:
        name:
          type: string
        accountIdentifications:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentification'
    ResponseForwardedData:
      type: object
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
        url:
          type: string
    ResponseListMeta:
      type: object
      properties:
        tracingId:
          type: string
        count:
          type: integer
          format: int32
        pagination:
          $ref: '#/components/schemas/Pagination'
    ResponseMeta:
      type: object
      properties:
        tracingId:
          type: string
    ResponseMetaWithCount:
      type: object
      properties:
        tracingId:
          type: string
        count:
          type: integer
          format: int32
    SortEnum:
      type: string
      description: The attribute on which resources / records returned should be sorted. Valid options for the sort parameter.
      enum:
      - date
      - -date
    StatementReference:
      type: object
      description: Unique reference for a statement period. This may be optionally populated if available.
      properties:
        value:
          type: string
    Transaction:
      type: object
      description: Details of a transaction (credit or debit) that has occurred on the account.
      properties:
        id:
          type: string
          description: Unique identifier of the transaction.
        date:
          type: string
          format: date-time
        bookingDateTime:
          type: string
          description: Date and time in UTC format of when a transaction was booked.
          format: date-time
        valueDateTime:
          type: string
          description: Date and time in UTC format when the funds either cease to be available (for debit transactions) or
            become available (for credit transactions) to the account owner.
          format: date-time
        status:
          $ref: '#/components/schemas/TransactionStatusEnum'
        amount:
          type: number
          description: The transaction amount.
        currency:
          type: string
          description: Currency the transaction amount is denoted in. Specified as a 3-letter ISO 4217 code.
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        grossAmount:
          $ref: '#/components/schemas/Amount'
        currencyExchange:
          $ref: '#/components/schemas/CurrencyExchange'
        chargeDetails:
          $ref: '#/components/schemas/TransactionChargeDetails'
        reference:
          type: string
        statementReferences:
          type: array
          items:
            $ref: '#/components/schemas/StatementReference'
        description:
          type: string
        transactionInformation:
          type: array
          description: Further details on the transaction. This is narrative data, caught as unstructured text.
          items:
            type: string
        addressDetails:
          $ref: '#/components/schemas/AddressDetails'
        isoBankTransactionCode:
          $ref: '#/components/schemas/IsoBankTransactionCode'
        proprietaryBankTransactionCode:
          $ref: '#/components/schemas/ProprietaryBankTransactionCode'
        balance:
          $ref: '#/components/schemas/TransactionBalance'
        payeeDetails:
          type: object
          description: Details of the beneficiary [person or business].
          properties:
            name:
              type: string
              description: The account holder name of the Payee.
            accountIdentifications:
              type: array
              description: The account identifications that identify the Payee's bank account.
              items:
                type: object
                properties:
                  type:
                    allOf:
                    - $ref: '#/components/schemas/AccountIdentificationType'
                    description: Describes the format of the account.
                  identification:
                    type: string
                    description: The value associated with the account identification type.
        payerDetails:
          type: object
          description: Details of the benefactor [person or business].
          properties:
            name:
              type: string
              description: The account holder name of the Payer.
            accountIdentifications:
              type: array
              description: The account identifications that identify the Payer's bank account.
              items:
                type: object
                properties:
                  type:
                    allOf:
                    - $ref: '#/components/schemas/AccountIdentificationType'
                    description: Describes the format of the account.
                  identification:
                    type: string
                    description: The value associated with the account identification type.
        merchant:
          $ref: '#/components/schemas/Merchant'
        enrichment:
          $ref: '#/components/schemas/Enrichment'
        supplementaryData:
          type: object
          description: Additional information that cannot be captured in a structured field or block.
        transactionMutability:
          type: string
          description: '__Optional__. Specifies the Mutability of the Transaction record.


            - A transaction with a `Status` of `Pending` is mutable.

            - A transaction with a `Status` of `Booked` where the `TransactionMutability` flag is not specified is not guaranteed
            to be immutable (although in most instances it will be).

            - A transaction with a `Status` of `Booked` with the `TransactionMutability` flag set to `Immutable` is immutable.

            - A transaction with a `Status` of `Booked` with the `TransactionMutability` flag set to `Mutable` is mutable.'
          example: Mutable
    TransactionBalance:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountBalanceType'
        balanceAmount:
          $ref: '#/components/schemas/Amount'
    TransactionChargeDetails:
      type: object
      description: Details the charges that will apply to the transaction.
      properties:
        chargeAmount:
          $ref: '#/components/schemas/Amount'
    TransactionHash:
      type: object
      description: An unique identifier for the transaction that was generated by Yapily. This is a hash of transaction attributes
        and may be useful an id is not present (and therefore hasn't been provided by an Institution).
      properties:
        hash:
          type: string
    TransactionStatusEnum:
      type: string
      enum:
      - BOOKED
      - PENDING
    UsageType:
      type: string
      description: The customer segment of the account.
      enum:
      - PERSONAL
      - BUSINESS
      - OTHER
      - UNKNOWN
