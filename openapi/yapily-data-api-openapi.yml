    Beneficiary:
      type: object
      description: Account information belonging to the target beneficiary (person/ business).
      properties:
        id:
          type: string
          description: Unique identifier of the `beneficiary`.
        reference:
          type: string
          description: A creditor reference that is requested to be used for all payment instructions to this beneficiary.
        payee:
          $ref: '#/components/schemas/BeneficiaryPayee'
        trusted:
          type: boolean
          description: Indicates whether the account owner has stated that this beneficiary should be trusted. This often
            results in reduced authentication and authorisation requirements on payments to the beneficiary.
    BeneficiaryPayee:
      description: __Mandatory__. Account details belonging to the `Beneficiary Payee` (person/ business). You must define
        this in your payment request along with all of the nested mandatory properties.
      required:
      - accountIdentifications
      type: object
      properties:
        name:
          type: string
          description: The account holder name of the beneficiary.
          example: Jane Doe
        accountIdentifications:
          type: array
          description: __Mandatory__. The account identifications that identify the `BeneficiaryPayee` bank account.
          example:
          - identification: '401016'
            type: SORT_CODE
          - identification: '71518920'
            type: ACCOUNT_NUMBER
          items:
            $ref: '#/components/schemas/AccountIdentification'
          uniqueItems: true
        address:
          $ref: '#/components/schemas/Address'
    Categorisation:
      type: object
      description: Income and Expense categorisation that the Yapily categorisation engine has determined for the transaction.
      properties:
        categories:
          type: array
          items:
            type: string
        source:
          type: string
    ConsolidatedAccountInformation:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the consolidated account. When used in Get Account Transactions calls, the transactions
            between the sub-accounts will not be reported
        accountBalances:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
      description: Summary information regarding account balances of the overall account provided by the bank
    CreditLine:
      type: object
      description: __Mandatory__. Details whether the account has access to a credit line from an `Institution`.
      properties:
        type:
          $ref: '#/components/schemas/CreditLineType'
        creditLineAmount:
          $ref: '#/components/schemas/Amount'
    CreditLineType:
      type: string
      description: __Mandatory__. The type of credit that has been provided.
      enum:
      - AVAILABLE
      - CREDIT
      - EMERGENCY
      - PRE_AGREED
      - TEMPORARY
      - OTHER
      - UNKNOWN
    CurrencyExchange:
      type: object
      description: Provides details on the currrency exchange.
      properties:
        sourceCurrency:
          type: string
          description: Currency from which an amount is to be converted.
        targetCurrency:
          type: string
          description: Currency to which an amount is to be converted.
        unitCurrency:
          type: string
          description: The currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP
            = xxxCUR, the unit currency is GBP.
        exchangeRate:
          type: number
          description: The factor used for conversion of an amount from one currency to another. This reflects the price at
            which one currency was bought with another currency.
    DirectDebitPayee:
      type: object
      properties:
        name:
          type: string
          description: __Mandatory__. The account holder name.
          example: Tempus Risus Company
    DirectDebitResponse:
      type: object
      properties:
        id:
          type: string
        statusDetails:
