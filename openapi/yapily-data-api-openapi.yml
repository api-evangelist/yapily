    Enrichment:
      type: object
      description: Enriched data that has been derived by Yapily using it's data processing and machine learning techniques.
      properties:
        categorisation:
          $ref: '#/components/schemas/Categorisation'
        transactionHash:
          $ref: '#/components/schemas/TransactionHash'
        cleansedDescription:
          type: string
          description: Cleaned version of the `Transaction Description` that removes miscellaneous, generic and unhelpful
            text.
        merchant:
          $ref: '#/components/schemas/EnrichmentMerchant'
        location:
          type: string
          description: The location of where the transaction took place.
        paymentProcessor:
          type: string
          description: A payment provider that manages (credit/debit) transactions between the `Institution` and the merchant.
        correctedDate:
          type: string
          description: The likely date and time on which the transaction took place. This is distinct from `Booking Date Time`
            which usually refers to the post-clearing value.
          format: date-time
    EnrichmentMerchant:
      type: object
      description: Details of the merchant, identified by Yapily data services.
      properties:
        merchantName:
          type: string
          description: The name of the indivdual merchant involved in the transaction e.g. (TESCO Petrol).
        parentGroup:
          type: string
          description: The parent organisation that the merchant belongs to e.g. (TESCO).
    ExchangeRateInformationResponse:
      required:
      - rateType
      - unitCurrency
      type: object
      properties:
        unitCurrency:
          type: string
          description: __Mandatory__. The currency in which the rate of exchange is expressed in a currency exchange. In the
            example 1GBP = xxxCUR, the unit currency is `GBP`.
        rate:
          type: number
          description: __Optional__. The factor used for conversion of an amount from one currency to another. This reflects
            the price at which one currency was bought with another currency.
        rateType:
          $ref: '#/components/schemas/RateTypeEnum'
        foreignExchangeContractReference:
          type: string
          description: __Optional__. The unique and unambiguous reference to the foreign exchange contract agreed between
            the initiating party/creditor and the debtor agent.
        exchangeRateExpiryDate:
          type: string
          format: date-time
    FilterAndSort:
      type: object
      properties:
        from:
          type: string
          description: __Optional__. The earliest date and time of resources / records that should be returned.
          format: date-time
        before:
          type: string
          description: __Optional__. The latest date and time of resources / records that should be returned.
          format: date-time
        limit:
          type: integer
