components:
  schemas:
    Account:
      type: object
      properties:
        id:
          description: Unique identifier of the account.
          type: string
        type:
          type: string
          description: Specifies the type of account e.g. (BUSINESS_CURRENT).
        description:
          description: Product name as defined by the financial institution for this account
          type: string
        balance:
          type: number
          description: "Main / headline balance for the account. \n\n Use of this field is recommended as fallback only. Instead,\
            \ use of the typed balances (accountBalances) is recommended."
        currency:
          description: "Currency the bank account balance is denoted in. \n\n Specified as a 3-letter ISO 4217 currency code"
          type: string
        usageType:
          $ref: '#/components/schemas/UsageType'
        accountType:
          $ref: '#/components/schemas/AccountType'
        nickname:
          description: "Nickname of the account that was provided by the account owner. \n\n May be used to aid identification\
            \ of the account."
          type: string
        details:
          description: Supplementary specifications that might be provided by the Bank. These provide further characteristics
            about the account.
          type: string
        accountNames:
          type: array
          items:
            $ref: '#/components/schemas/AccountName'
        accountIdentifications:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentification'
        accountBalances:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
        consolidatedAccountInformation:
          $ref: '#/components/schemas/ConsolidatedAccountInformation'
    AccountApiListResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseListMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        links:
          type: object
          additionalProperties:
            type: string
        forwardedData:
          type: array
          items:
            $ref: '#/components/schemas/ResponseForwardedData'
        raw:
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/RawResponse'
        paging:
          $ref: '#/components/schemas/FilteredClientPayloadListAccount'
        tracingId:
          type: string
          writeOnly: true
    AccountBalance:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountBalanceType'
        dateTime:
          type: string
          format: date-time
          description: Date and time of the reported balance.
        balanceAmount:
          $ref: '#/components/schemas/Amount'
        creditLineIncluded:
          type: boolean
          description: __Optional__. Indicates whether any credit lines are included in the balance.
        creditLines:
          type: array
          description: __Optional__. Specifies the type of balance.
          items:
            $ref: '#/components/schemas/CreditLine'
    AccountBalanceType:
      type: string
      description: Specifies the type of the stated account balance.
      enum:
      - CLOSING_AVAILABLE
      - CLOSING_BOOKED
      - CLOSING_CLEARED
      - EXPECTED
      - FORWARD_AVAILABLE
      - INFORMATION
      - INTERIM_AVAILABLE
      - INTERIM_BOOKED
      - INTERIM_CLEARED
      - OPENING_AVAILABLE
      - OPENING_BOOKED
      - OPENING_CLEARED
      - PREVIOUSLY_CLOSED_BOOKED
      - AUTHORISED
      - OTHER
      - UNKNOWN
    AccountIdentification:
      title: Account Identifications
      required:
      - type
      - identification
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentificationType'
        identification:
          title: Account Identification
          type: string
          description: "__Mandatory__. The value associated with the account identification type.\n\n See [Account Identification\
            \ Combinations](/payments/payment-resources/intro-to-payment-execution#account-identifications-combinations) for\
            \ more information on the format of the values."
          example: '401016'
    AccountIdentificationType:
      title: Account Identification Type
      type: string
      description: "__Mandatory__. Used to describe the format of the account.\n\n See [Account Identification Combinations](/payments/payment-resources/intro-to-payment-execution#account-identifications-combinations)\
        \ for more information on when to specify each type."
      example: SORT_CODE
      enum:
      - SORT_CODE
      - ACCOUNT_NUMBER
      - IBAN
      - BBAN
      - BIC
      - PAN
      - MASKED_PAN
      - MSISDN
      - BSB
      - NCC
      - ABA
      - ABA_WIRE
      - ABA_ACH
      - EMAIL
      - ROLL_NUMBER
      - BLZ
      - IFS
      - CLABE
      - CTN
      - BRANCH_CODE
      - VIRTUAL_ACCOUNT_ID
    AccountName:
      type: object
      properties:
        name:
          description: The bank account holder's name given by the account owner.
          type: string
    AccountStatement:
      type: object
      description: Statement information belonging to the account.
      properties:
        id:
          description: Unique identifier for the statement.
          type: string
        startDateTime:
          type: string
          description: Date and time of when the statement period starts.
          format: date-time
        endDateTime:
          type: string
          description: Date and time of when the statement period ends.
          format: date-time
        creationDateTime:
          type: string
          description: Date and time of when the statement was created.
          format: date-time
    AccountType:
      type: string
      description: The type of account e.g. (Credit Card, Savings).
      enum:
      - CASH_TRADING
      - CASH_INCOME
      - CASH_PAYMENT
      - CHARGE_CARD
      - CHARGES
      - COMMISSION
      - CREDIT_CARD
      - CURRENT
      - E_MONEY
      - LIMITED_LIQUIDITY_SAVINGS_ACCOUNT
      - LOAN
      - MARGINAL_LENDING
      - MONEY_MARKET
      - MORTGAGE
      - NON_RESIDENT_EXTERNAL
      - OTHER
      - OVERDRAFT
      - OVERNIGHT_DEPOSIT
      - PREPAID_CARD
      - SALARY
      - SAVINGS
      - SETTLEMENT
      - TAX
      - UNKNOWN
    Address:
      title: Address Details
      type: object
      properties:
        addressLines:
          title: Address Lines
          type: array
          description: __Optional__. The address line of the address
          example:
          - Ardenham Court
          items:
            type: string
        streetName:
          title: Street
          type: string
          description: __Optional__. The street name of the address
          example: Oxford Road
        buildingNumber:
          title: Building Number
          type: string
          description: __Optional__. The building number of the address
          example: '45'
        postCode:
          title: Post Code
          type: string
          description: __Optional__. The post code of the address
          example: HP19 3EQ
        townName:
          title: Town
          type: string
          description: __Optional__. The town name of the address
          example: Aylesbury
        county:
          title: County
          type: array
          description: __Optional__. The list of counties for the address
          example:
          - Buckinghamshire
          items:
            type: string
        country:
          title: Country
          type: string
          description: "__Conditional__. The 2-letter country code for the address. \n\nAn `Institution` may require you to\
            \ specify the `country` when used in the context of the `Payee` to be able to make a payment"
          example: GB
        department:
          title: Department
          type: string
          description: __Optional__. The department for the address
          example: Unit 2
        subDepartment:
          title: Sub-Department
          type: string
          description: __Optional__. The sub-department for the address
          example: Floor 3
        addressType:
          $ref: '#/components/schemas/AddressTypeEnum'
      description: '__Conditional__. The address of the `Payee` or `Payer`.


        - `payee.address` is mandatory when the `paymentType` is an `INTERNATIONAL` payment

        - An `Institution` may require you to specify the `country` when used in the context of the `Payee` to be able to
        make a payment.'
      example:
        country: GB
    AddressDetails:
      type: object
      properties:
        addressLine:
          type: string
          description: Information, in free format text, that identifies a specific address.
    AddressTypeEnum:
      title: Address Type
      type: string
