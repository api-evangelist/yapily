        payer:
          $ref: '#/components/schemas/Payer'
        refundAccount:
          $ref: '#/components/schemas/RefundAccount'
        expectedExecutionTime:
          type: string
          format: date-time
        expectedSettlementTime:
          type: string
          format: date-time
        riskDetails:
          $comment: 'NOTE: This model is shared between Sweeping and Commercial, but we use VrpSweepingRiskDetails because it is minimal and sufficient!'
          $ref: '#/components/schemas/VrpSweepingRiskDetails'
    VrpComplianceDataIndividual:
      type: object
      required:
      - name
      - birthDate
      properties:
        name:
          type: string
          example: John Doe
          description: This is the first and last name of your end user.
        birthDate:
          type: string
          format: date
          example: '2000-08-12'
          description: This is the date of birth of your end user.
      description: __Conditional__. Mandatory if the type is INDIVIDUAL.
    RawRequest:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        requestInstant:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: object
        bodyParameters:
          type: object
          additionalProperties:
            type: string
        startTime:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          deprecated: true
    PaymentStatusDetails:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        statusReason:
          type: string
        statusReasonDescription:
          type: string
        statusUpdateDate:
          type: string
          format: date-time
        multiAuthorisationStatus:
          $ref: '#/components/schemas/MultiAuthorisation'
        isoStatus:
          $ref: '#/components/schemas/PaymentIsoStatus'
  securitySchemes:
    basicAuth:
      description: Use HTTP Basic Authentication with your Application ID as username and Application Secret as password. Manage credentials in the [Yapily Console](https://console.yapily.com/). See [Authentication](/api-reference/authentication) for details.
      scheme: basic
      type: http
