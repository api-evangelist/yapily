openapi: 3.0.1
info:
  title: Yapily Beneficiaries Application Beneficiaries Variable Recurring Payments API
  description: Application and User Beneficiaries endpoints for managing reusable payment counterparties.
  version: 12.4.0
  contact:
    name: Yapily Support
    url: https://docs.yapily.com/resources/support
    email: support@yapily.com
servers:
- url: https://api.yapily.com
security:
- basicAuth: []
tags:
- description: "Variable Recurring Payments enables transfer of money between accounts held by the same person or transfer of money for business payments. \n\nIn order to make Sweeping Variable Recurring Payments on behalf of a user, you are required to request an [Consent](#tag/Authorisations) from the user by calling the Sweeping Consent endpoint to authorise the user's account to make the payment. Once a `consent-token` is obtained, you can call the Payments endpoint to execute the Sweeping Variable Recurring Payments transaction. Before executing the payment, you have the option to confirm availability of funds in the user's account by calling the Funds Confirmation endpoint. \n\nSee [VRP Payments](/payments/vrps/additional-information) for more information."
  name: Variable Recurring Payments
paths:
  /variable-recurring-payments/sweeping/consents:
    post:
      description: 'Initiate authorisation for a Sweeping [VRP](/payments/vrps/introduction) consent.


        The response will contain an Authorisation URL and the associated Consent ID. The user will have to complete authorisation of the consent at their institution via [Redirect Flows](/getting-started/glossary#redirect-flow), after which you will be able to use the authorised consent to create payments.


        Feature:


        - `INITIATE_DOMESTIC_VARIABLE_RECURRING_PAYMENT_SWEEPING`'
      operationId: createSweepingAuthorisation
      x-mint:
        content: '<Info>Learn more: [Variable Recurring Payments](/payments/vrps/introduction)</Info>'
      requestBody:
        content:
          application/json;charset=UTF-8:
            examples:
              UK Sweeping VRP Authorisation Request:
                description: UK Sweeping VRP Authorisation Request
                value:
                  userUuid: 5350782b-60f3-489e-aae5-a24d8d679a07
                  institutionId: modelo-sandbox
                  callback: https://display-parameters.com/
                  controlParameters:
                    psuAuthenticationMethods:
                    - SCA_NOT_REQUIRED
                    maxAmountPerPayment:
                      amount: 10
                      currency: GBP
                    periodicLimits:
                    - totalMaxAmount:
                        amount: 50
                        currency: GBP
                      frequency: MONTHLY
                      alignment: CONSENT
                  initiationDetails:
                    reference: My Sweeping VRP
                    payer:
                      name: Jane Doe
                      accountIdentifications:
                      - type: ACCOUNT_NUMBER
                        identification: '87654321'
                      - type: SORT_CODE
                        identification: '332211'
                    payee:
                      name: John Doe
                      accountIdentifications:
                      - type: ACCOUNT_NUMBER
                        identification: '12345678'
                      - type: SORT_CODE
                        identification: '112233'
            schema:
              $ref: '#/components/schemas/VrpSweepingAuthorisationRequest'
        required: true
      responses:
