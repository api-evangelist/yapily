      properties:
        name:
          type: string
        accountIdentifications:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/HostedVrpAccountIdentification'
    PaymentContextType:
      title: Payment Code
      type: string
      default: OTHER
      description: __Optional__. The payment context code. This defaults to `OTHER` if not specified.
      enum:
      - BILL
      - GOODS
      - SERVICES
      - OTHER
      - PERSON_TO_PERSON
      - BILL_IN_ADVANCE
      - BILL_IN_ARREARS
      - ECOMMERCE_MERCHANT
      - FACE_TO_FACE_POS
      - TRANSFER_TO_SELF
      - TRANSFER_TO_THIRD_PARTY
      - PISP_PAYEE
    VRPSetupRequest:
      required:
      - payee
      type: object
      properties:
        payer:
          $ref: '#/components/schemas/Payer'
        payee:
          $ref: '#/components/schemas/Payee'
        reference:
          type: string
          description: __Optional__. The payment reference or description. Limited to a maximum of 18 characters long.
          example: Own Account Sweeping
        limits:
          $ref: '#/components/schemas/HostedVRPLimitsRequest'
        validFrom:
          type: string
          format: date-time
          description: __Optional__. Start date when the consent becomes valid.
        validTo:
          type: string
          format: date-time
          description: __Optional__. End date when the consent expires and becomes invalid.
        recurringPaymentCategory:
          type: string
          description: "The use-case for the VRP consent supported by the bank. Allowed values: \n\n`ONGOING` \n\n`SUBSCRIPTION`"
        initialPayment:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: __Optional__. Initial payment to be charged under this consent. If enforced, this amount must match the first payment amount executed using this consent.
        risk:
          $ref: '#/components/schemas/PaymentRisk'
    AccountIdentification:
      title: Account Identifications
      required:
      - type
      - identification
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentificationType'
        identification:
          title: Account Identification
          type: string
          description: "__Mandatory__. The value associated with the account identification type.\n\n See [Account Identification Combinations](/payments/payment-resources/intro-to-payment-execution#account-identifications-combinations) for more information on the format of the values."
          example: '401016'
    HostedPaymentIsoStatus:
      description: The ISO status of the payment.
      type: object
      properties:
        code:
          type: string
          description: "The ISO 20022 `PaymentStatusCode`. One of : \n\n ACSC \n\n ACCC \n\n ACCP  \n\n ACSP \n\n ACTC \n\n ACWC \n\n ACWP \n\n ACFC \n\n RCVD \n\n PART \n\n PATC \n\n PDNG \n\n RJCT \n\n CANC"
          example: ACSC
        name:
          type: string
          description: The full name of the ISO 20022 `PaymentStatusCode`.
          example: AcceptedCreditSettlementCompleted
    PayeeAccountType:
      title: Payee Account Type
      type: string
      description: "__Optional__. The payee account type. \n\nAllowed values: BUSINESS, BUSINESS_SAVING, CHARITY, COLLECTION, CORPORATE, E_WALLET, GOVERNMENT, INVESTMENT, INVESTMENT_ISA, JOINT_PERSONAL, PENSION, PERSONAL, PERSONAL_SAVING, PREMIER, WEALTH ."
    ApiResponseOfCreateHostedPaymentRequestLink:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          $ref: '#/components/schemas/HostedPaymentRequestResponse'
    HostedVrpAccountIdentification:
      title: Account Identifications
      required:
      - type
      - identification
      type: object
      properties:
        type:
          $ref: '#/components/schemas/HostedVrpAccountIdentificationType'
        identification:
          title: Account Identification
          type: string
          description: "__Mandatory__. The value associated with the account identification type.\n\n See [Account Identification Combinations](/payments/payment-resources/intro-to-payment-execution#account-identifications-combinations) for more information on the format of the values."
          example: '401016'
    VrpFundsAvailable:
      required:
      - fundsAvailable
      - fundsAvailableAt
