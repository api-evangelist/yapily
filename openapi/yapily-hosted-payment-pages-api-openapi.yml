        amountDetails:
          $ref: '#/components/schemas/HostedAmountDetails'
        paymentDueDate:
          type: string
          format: date
          description: The date that the payment is due. Displayed to the end user in the payment summary screen.
    AddressTypeEnum:
      title: Address Type
      type: string
      description: __Optional__. The type of address
      enum:
      - BUSINESS
      - CORRESPONDENCE
      - DELIVERY_TO
      - MAIL_TO
      - PO_BOX
      - POSTAL
      - RESIDENTIAL
      - STATEMENT
      - UNKNOWN
    ApiResponseOfGetHostedVRPPaymentRequest:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          $ref: '#/components/schemas/HostedVRPPaymentResponse'
        tracingId:
          type: string
          writeOnly: true
    HostedVRPConsentRequestResponse:
      required:
      - id
      - applicationId
      - hostedUrl
      - authToken
      - createdAt
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Represents the Unique Id of the VRP consent request
        userId:
          type: string
          format: uuid
          description: Represents the Unique Id for the `User` assigned by Yapily.
        applicationUserId:
          type: string
          description: Represents the user-friendly reference to the `User`.
        applicationId:
          type: string
          format: uuid
          description: Represents the Unique Id of the `Application` the user is associated with.
        institutionIdentifiers:
          $ref: '#/components/schemas/InstitutionIdentifiers'
        userSettings:
          $ref: '#/components/schemas/UserSettings'
        redirectUrl:
          type: string
          description: URL of client's server to redirect the PSU after completion of the consent authorisation.
          example: https://tpp-application.com
        vrpSetup:
          $ref: '#/components/schemas/VRPSetupRequest'
        hostedUrl:
          type: string
          description: "Represents the URL of Hosted UI page for the applicationId which initiates the user journey for the Consent. \n\n URL would be appended with authToken, applicationId and userSettings."
        authToken:
          type: string
          description: Represents the JWT Token signed by the certificate-vault using Yapily's keys.
        createdAt:
          type: string
          format: date-time
          description: Represents the date and time at which the Consent was created.
        authorisationExpiresAt:
          type: string
          format: date-time
          description: Represents the date and time at which the auth Token will expire.
    VrpFundsConfirmationRequest:
      type: object
      required:
      - paymentAmount
      properties:
        paymentAmount:
          $ref: '#/components/schemas/Amount'
        reference:
          type: string
          description: __Optional__. The reference/description associated with the VRP consent. Limited to a maximum of 18 characters long.
    HostedPaymentDetails:
      type: object
      properties:
        paymentRequestId:
          type: string
          format: uuid
          description: The unique ID of the payment request.
        userId:
          type: string
          format: uuid
          description: The Unique Identifier for the `User` assigned by Yapily.
        applicationUserId:
          type: string
          description: Your reference to the `User`.
        applicationId:
          type: string
          format: uuid
          description: The Unique Identifier of the `Application` the user is associated with.
        institutionIdentifiers:
          $ref: '#/components/schemas/InstitutionIdentifiersResponse'
        userSettings:
          $ref: '#/components/schemas/UserSettings'
        redirectUrl:
          type: string
          description: URL of your server to redirect the user after completion of the payment flow.
          example: https://tpp-application.com
        paymentRequestDetails:
          $ref: '#/components/schemas/HostedPaymentRequestDetailsLink'
        createdAt:
          type: string
          description: The date and time at which the payment request was created.
          format: date-time
        authorisationExpiresAt:
          type: string
          format: date-time
          description: The date and time at which the auth Token will expire.
        status:
          type: string
          description: "Current status of the payment request. \n\n Possible values: \n\n ACTIVE \n\n INACTIVE"
        payments:
          uniqueItems: true
          type: array
          description: Payments that have been initiated as part of this request
          items:
            $ref: '#/components/schemas/HostedPayment'
    UserSettings:
      description: Specifies the language and location preferences of the user.
      type: object
      properties:
        language:
          type: string
          description: 2 letter ISO Language code which denotes the language preference for the `User`.
          example: en
        location:
          type: string
          description: 2 letter ISO Country code which denotes the location preference for the `User`.
          example: GB
    ApiResponseOfGetHostedVRPConsentRequest:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          $ref: '#/components/schemas/HostedVRPConsentDetails'
    AccountIdentificationResponse:
      title: Account Identifications
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentificationTypeResponse'
        identification:
          title: Account Identification
          type: string
          description: "The value associated with the account identification type.\n\n See [Account Identification Combinations](/payments/payment-resources/intro-to-payment-execution#account-identifications-combinations) for more information on the format of the values."
          example: '401016'
    Address:
      title: Address Details
      type: object
      properties:
        addressLines:
          title: Address Lines
          type: array
          description: __Optional__. The address line of the address
          example:
          - Ardenham Court
          items:
            type: string
        streetName:
          title: Street
          type: string
          description: __Optional__. The street name of the address
          example: Oxford Road
        buildingNumber:
          title: Building Number
          type: string
          description: __Optional__. The building number of the address
          example: '45'
        postCode:
          title: Post Code
          type: string
          description: __Optional__. The post code of the address
          example: HP19 3EQ
        townName:
          title: Town
          type: string
          description: __Optional__. The town name of the address
          example: Aylesbury
        county:
          title: County
          type: array
          description: __Optional__. The list of counties for the address
          example:
          - Buckinghamshire
          items:
            type: string
        country:
          title: Country
          type: string
          description: "__Conditional__. The 2-letter country code for the address. \n\nAn `Institution` may require you to specify the `country` when used in the context of the `Payee` to be able to make a payment"
          example: GB
        department:
          title: Department
          type: string
          description: __Optional__. The department for the address
          example: Unit 2
        subDepartment:
          title: Sub-Department
          type: string
          description: __Optional__. The sub-department for the address
          example: Floor 3
        addressType:
          $ref: '#/components/schemas/AddressTypeEnum'
      description: '__Conditional__. The address of the `Payee` or `Payer`.


        - `payee.address` is mandatory when the `paymentType` is an `INTERNATIONAL` payment

        - An `Institution` may require you to specify the `country` when used in the context of the `Payee` to be able to make a payment.'
      example:
        country: GB
    HostedPaymentPhase:
      type: object
      properties:
        phaseName:
          type: string
          description: "The name of the hosted payment process phase. Allowed values are : \n\n- INITIATED - Payment process initiated\n- DECLINED - Payment process failed and will not proceed further\n- INSTITUTION_SUBMITTED - Payment institution submitted\n- EMBEDDED_CREDENTIAL_REQUESTED - For embedded banks, a UI element to collect user credentials was displayed\n- CREDENTIALS_ERROR - embedded credentials refused by institution\n- AUTHORISATION_INITIATED - All details required for payment initiation have been collected\n- VALIDATION_COMPLETED - The payment payload was validated successfully\n- VALIDATION_FAILED - The payment data provided failed validation\n- AUTHORISATION_CREATED - Payment authorisation request created with Institution\n- EMBEDDED_CODE_REQUESTED - For embedded banks, a UI element to collect SCA for initiated consent was displayed\n- EMBEDDED_TYPE_REQUESTED - For embedded banks, a UI element to allow the user to select their preferred SCA method for this consent authorisation was displayed\n- DECOUPLED_AUTHORISATION - For embedded banks, decoupled authorisation was initiated by the bank\n- EMBEDDED_CODE_COLLECTED - For embedded banks, SCA code was collected for consent authorisation\n- EMBEDDED_TYPE_SELECTED - For embedded banks, preferred SCA method was selected for consent authorisation\n- PRE_AUTHORISED - pre authorisation was initiated by bank\n- CONSENT_POLLING_STARTED - We start polling the bank for consent authorisation status\n- CONSENT_POLLING_ENDED - We finish polling the bank for consent authorisation status\n- AUTHORISED - Payment authorisation completed\n- AUTHORISATION_FAILED - Payment authorisation failed and will not proceed further\n- AUTHORISATION_REJECTED - Payment authorisation rejected and will not proceed further\n- SUBMITTED - Payment execution created and submitted to Institution\n- SUBMITTED_AUTO - Payment execution created and submitted to Institution\n- ACCEPTED - Payment execution accepted by Institution and awaiting settlement\n- REJECTED - Payment or Authorisation request rejected by Institution and will not proceed further\n- SETTLEMENT_COMPLETED - Payment settlement completed\n- STATUS_POLLING_STARTED - Payment status polling started\n- STATUS_POLLING_ENDED - Payment status polling ended\n- MERCHANT_ACKNOWLEDGED - Payment acknowledgement received from merchant\n- FINISHED - Payment process completed"
        phaseCreatedAt:
          type: string
          format: date-time
          description: The date and time when phase of the hosted payment was inserted.
      description: The phase of the payment.
    HostedPaymentStatusDetails:
      description: The status of the payment.
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        statusUpdateDate:
          description: Date and time the status was updated.
          type: string
          format: date-time
        isoStatus:
          $ref: '#/components/schemas/HostedPaymentIsoStatus'
    InstitutionIdentifiersResponse:
      description: Specifies the institution selected for making the payment.
      type: object
      properties:
        institutionId:
          type: string
          description: Yapily identifier which identifies the `Institution` the payment request is sent to.
        institutionCountryCode:
          type: string
          description: 2 letter ISO Country code of the `Institution` the payment request is sent to.
          example: GB
    ApiResponseOfVrpFundsConfirmationResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          $ref: '#/components/schemas/VrpFundsConfirmationResponse'
        links:
          type: object
          additionalProperties:
            type: string
        forwardedData:
          type: array
          items:
            $ref: '#/components/schemas/ResponseForwardedData'
        tracingId:
          type: string
          writeOnly: true
        raw:
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/RawResponse'
    HostedVRPPhase:
      type: object
      properties:
        phaseName:
          type: string
          description: "The name of the hosted VRP consent process phase. Allowed values are : \n\n- INITIATED - Process initiated\n- DECLINED - Process failed and will not proceed further\n- INSTITUTION_SUBMITTED - Consent institution submitted\n- INPUT_CAPTURED - Additional input captured to process the Consent\n- IBAN_VALIDATED - Payer IBAN successfully validated\n- AUTHORISATION_CREATED - Consent authorisation request created with Institution, awaiting authorisation completion\n- AUTHORISATION_REJECTED - Consent Authorisation request rejected by Institution and will not proceed further\n- AUTHORISED - Consent authorisation completed\n- AUTHORISATION_FAILED - Consent authorisation failed and will not proceed further\n- SUBMITTED - Consent execution created and submitted to Institution\n- ACCEPTED - Consent execution accepted by Institution and awaiting settlement\n- REJECTED - Consent execution request rejected by Institution and will not proceed further\n- STATUS_POLLING_STARTED - Consent status polling started\n- STATUS_POLLING_ENDED - Consent status polling ended\n- MERCHANT_ACKNOWLEDGED - Consent acknowledgement received from merchant\n- FINISHED - Consent process completed\n- REVOKED - Consent process completed"
        phaseCreatedAt:
          type: string
          format: date-time
          description: The date and time at which the phase of the hosted Consent was created.
      description: The phase of the VRP Consent Request.
    ApiResponseOfGetHostedVRPConsentsRequest:
