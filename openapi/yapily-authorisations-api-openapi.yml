    BulkPaymentEmbeddedAuthorisationRequest:
      required:
      - institutionId
      type: object
      properties:
        userUuid:
          type: string
          format: uuid
          description: __Conditional__. The reference to the `User` that will authorise the authorisation request using the Yapily generated UUID. Either the `userUuid` or `applicationUserId` must be provided.
          example: e006a012-c306-4355-a6a1-99bf69ae5171
        applicationUserId:
          type: string
          description: __Conditional__. The user-friendly reference to the `User` that will authorise the authorisation request. If a `User` with the specified `applicationUserId` exists, it will be used otherwise, a new `User` with the specified `applicationUserId` will be created and used. Either the `userUuid` or `applicationUserId` must be provided.
          example: user-234562290
        institutionId:
          type: string
          description: __Mandatory__. The reference to the `Institution` which identifies which institution the authorisation request is sent to.
          example: yapily-mock
        callback:
          type: string
          description: "__Optional__. The server to redirect the user to after the user complete the authorisation at the `Institution`. \n\nSee [Using a callback (Optional)](/open-banking-flow/handling-redirects/callback-url) for more information."
          example: https://display-parameters.com
        redirect:
          $ref: '#/components/schemas/RedirectRequest'
        oneTimeToken:
          type: boolean
          description: "__Conditional__. Used to receive a `oneTimeToken` rather than a `consentToken` at the `callback` for additional security. This can only be used when the `callback` is set. \n\nSee [Using a callback with an OTT (Optional)](/open-banking-flow/handling-redirects/callback-url) for more information."
          example: false
        paymentRequest:
          $ref: '#/components/schemas/BulkPaymentRequest'
        userCredentials:
          $ref: '#/components/schemas/UserCredentials'
        selectedScaMethod:
          $ref: '#/components/schemas/ScaMethod'
        scaCode:
          type: string
          description: '__Conditional__. Used to update the authorisation with the sca code received by the user from the `Institution` using the embedded payment authorisation flow.


            This is the penultimate step required in the embedded payment authorisation flow to authorise the `Consent`. After sending the sca code, to obtain an authorised consent, the last step is to poll [Get Consent](/api-reference/getConsentById) until the `Institution` authorises the request and the `Consent` `status` transitions to `AUTHORIZED`.'
          example: '325614'
      description: The request body containing a `BulkPaymentEmbeddedAuthorisationRequest` json payload
    InternationalPaymentRequest:
      required:
      - currencyOfTransfer
      type: object
      properties:
        currencyOfTransfer:
          type: string
          description: __Mandatory__. The currency to be transferred to the payee. This may differ from the currency the payment is denoted in and the currency of the payer's account. Specified as a 3-letter code (ISO 4217).
        exchangeRateInformation:
          $ref: '#/components/schemas/ExchangeRateInformation'
        purpose:
          type: string
          description: __Optional__. Used to indicate the external purpose as a [ISO20022 purpose code](https://www.rba.hr/documents/20182/183267/External+purpose+codes+list/8a28f888-1f83-5e29-d6ed-fce05f428689?version=1.1) value.
        priority:
          $ref: '#/components/schemas/PriorityCodeEnum'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearerType'
      description: "__Conditional__. Used to specify properties to define an international payment. \n\nMust be specified when the payment `type` is one of the following:\n\n- `INTERNATIONAL_SINGLE_PAYMENT`\n- `INTERNATIONAL_SCHEDULED_PAYMENT`\n- `INTERNATIONAL_PERIODIC_PAYMENT`"
    ScaMethod:
      required:
      - id
      type: object
      description: "__Conditional__. Used to update the authorisation with the sca method of the user's choice for the `Institution` that uses the embedded authorisation flow. If the user has multiple sca methods configured, the `Institution` will allow the user to select from each of these options. \n\nWhen the user has multiple sca methods for the `Institution`, this is the second step required in the embedded authorisation flow to authorise the `Consent`."
      example:
        id: '944'
        type: PUSH_OTP
        description: SecureSIGN
      properties:
        id:
          type: string
          description: __Mandatory__. The id of the sca method provided by the `Institution`
          example: 258211#OPTICAL
        type:
          $ref: '#/components/schemas/Type'
        description:
          type: string
          description: __Optional__. A description of the sca method if provided by the `Institution`
          example: Testkarte Hr. Haubach_1, optisch
        information:
          type: string
          description: Additional information from the institution to provide to the PSU to help with the selected SCA method. The language is determined by the institution and may vary.
          example: Bitte bestätigen Sie den Vorgang in Ihrer SecureGo plus App
        data:
          description: Data from the institution to provide to the PSU to complete authorisation. The language is determined by the institution and may vary.
          type: array
          items:
            type: string
          example:
          - 0488701109982928CY439040000100000010000520,00
